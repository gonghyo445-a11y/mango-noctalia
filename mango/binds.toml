[bind.default]
"SUPER+Q" = "killclient,"
"SUPER+V" = "togglefloating,"
"SUPER+SHIFT+f" = "togglefullscreen,"
"SUPER+f" = "togglemaximizescreen,"
"SUPER+SHIFT+g" = "toggleglobal,"
"SUPER+c" = "centerwin"

"SUPER+Up" = "focusdir,up"
"SUPER+Down" = "focusdir,down"
"SUPER+Left" = "focusdir,left"
"SUPER+Right" = "focusdir,right"

"SUPER+K" = "focusdir,up"
"SUPER+J" = "focusdir,down"
"SUPER+H" = "focusdir,left"
"SUPER+L" = "focusdir,right"

"SUPER+SHIFT+Up" = "exchange_client,up"
"SUPER+SHIFT+Down" = "exchange_client,down"
"SUPER+SHIFT+Left" = "exchange_client,left"


"SUPER+SHIFT+K" = "exchange_client,up"
"SUPER+SHIFT+J" = "exchange_client,down"
"SUPER+SHIFT+H" = "exchange_client,left"
"SUPER+SHIFT+L" = "exchange_client,right"

"SUPER+I" = "viewtoleft,0"
"SUPER+U" = "viewtoright,0"
"SUPER+SHIFT+I" = "tagtoleft,0"
"SUPER+SHIFT+U" = "tagtoright,0"

"SUPER+1" = "view,1,0"
"SUPER+2" = "view,2,0"
"SUPER+3" = "view,3,0" 
"SUPER+4" = "view,4,0"
"SUPER+5" = "view,5,0"
"SUPER+6" = "view,6,0"
"SUPER+7" = "view,7,0"

"SUPER+SHIFT+1" = "tag,1,0"
"SUPER+SHIFT+2" = "tag,2,0"
"SUPER+SHIFT+3" = "tag,3,0"
"SUPER+SHIFT+4" = "tag,4,0"
"SUPER+SHIFT+5" = "tag,5,0"
"SUPER+SHIFT+6" = "tag,6,0"
"SUPER+SHIFT+7" = "tag,7,0"

"SUPER+Tab" = "switch_layout"

# Scroller layout
"SUPER+r" = "switch_proportion_preset,"

# util settings
"SUPER+space" = "spawn_shell,pkill -x rofi || rofi -show drun -show-icons" 
"SUPER+S" = "spawn_shell,pkill -x wlsunset || wlsunset"
"SUPER+x" = "spawn_shell,pkill -x wlogout || wlogout"
"SUPER+SHIFT+w" = "spawn_shell,pkill -x rofi || ~/.config/mango/scripts/walchange-rofi.sh"


"none+XF86AudioRaiseVolume" = "spawn,wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+"
"none+XF86AudioLowerVolume" = "spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"none+XF86AudioMute" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"none+XF86MonBrightnessUp" = "spawn,brightnessctl set 5%+"
"none+XF86MonBrightnessDown" = "spawn,brightnessctl -n20 set 5%-"

"CTRL+SHIFT+s" = "spawn_shell,pkill -x slurp || hyprshot -m region"

"SUPER+SHIFT+r" = "reload_config"

"SUPER+SHIFT+m" = "quit"
"SUPER+o" = "toggleoverview,"
"SUPER+SHIFT+tab" = "togglejump"

"SUPER+G" = "spawn,steam"
"SUPER+B" = "spawn,helium-browser"

"SUPER+t" = "spawn,alacritty"

"SUPER+P" = "setkeymode,passthrough"

[mousebind.default]
"SUPER+btn_left" = "moveresize,curmove"
"SUPER+btn_right" = "moveresize,curresize"

[axisbind.default]
"SUPER+UP" = "focusdir,left"
"SUPER+DOWN" = "focusdir,right"

"SUPER+SHIFT+UP" = "viewtoleft,0"
"SUPER+SHIFT+DOWN" = "viewtoright,0"

[gesturebind.default]
"none+right+3" = "focusdir,left"
"none+left+3" = "focusdir,right"

"none+down+3" = "viewtoleft,0"
"none+up+3" = "viewtoright,0"


[bind.passthrough]
"SUPER+Escape" = "setkeymode,default"



